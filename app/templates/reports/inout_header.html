{% extends "base.html" %}
{% block title %}入出單據{% endblock %}
{% block content %}
<h3>入出單據查詢</h3>
<form method="get" class="row g-2 align-items-end bg-white p-3 border rounded mb-3">
  <div class="col-auto">
    <label class="form-label">日期從</label>
    <input type="date" name="date_from" class="form-control" value="{{ args.get('date_from', '') }}">
  </div>
  <div class="col-auto">
    <label class="form-label">日期到</label>
    <input type="date" name="date_to" class="form-control" value="{{ args.get('date_to', '') }}">
  </div>
  <div class="col-auto">
    <label class="form-label">類別</label>
    <select name="doc_type" class="form-select">
      <option value="" {% if not args.get('doc_type') %}selected{% endif %}>全部</option>
      <option value="IN" {% if args.get('doc_type') == 'IN' %}selected{% endif %}>入庫</option>
      <option value="OUT" {% if args.get('doc_type') == 'OUT' %}selected{% endif %}>出庫</option>
    </select>
  </div>
  <div class="col-auto">
    <label class="form-label">經手人</label>
    <select name="employee_id" class="form-select">
      <option value="">全部</option>
      {% for e in employees %}
      <option value="{{ e.EmployeeId }}" {% if args.get('employee_id') == e.EmployeeId %}selected{% endif %}>{{ e.EmployeeName }} ({{ e.EmployeeId }})</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-auto">
    <button type="submit" class="btn btn-primary">查詢</button>
    <a class="btn btn-success" href="{{ url_for('reports.inout_header_export', **args) }}">匯出Excel</a>
  </div>
</form>

<table class="table table-striped table-bordered bg-white">
  <thead>
    <tr>
      <th>類別</th>
      <th>單號</th>
      <th>日期</th>
      <th>經手人</th>
    </tr>
  </thead>
  <tbody>
    {% for r in rows %}
    <tr>
      <td>{{ '入庫' if r.DocType == 'IN' else '出庫' }}</td>
      <td>{{ r.DocId }}</td>
      <td>{{ r.DocDate }}</td>
      <td>{{ r.EmployeeName }} ({{ r.EmployeeId }})</td>
    </tr>
    {% else %}
    <tr><td colspan="4" class="text-center text-muted">查無資料</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
