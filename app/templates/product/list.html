{% extends "base.html" %}
{% block title %}物料管理{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>物料管理</h3>
  <a class="btn btn-primary" href="{{ url_for('product.create_view') }}">+ 新增物料</a>
</div>
<table class="table table-striped table-bordered table-mini-erp bg-white">
  <thead>
    <tr>
      <th>物料編號</th>
      <th>物料名稱</th>
      <th class="text-end">庫存量</th>
      <th style="width: 220px;">操作</th>
    </tr>
  </thead>
  <tbody>
    {% for r in rows %}
    <tr>
      <td>{{ r.ProductId }}</td>
      <td>{{ r.ProductName }}</td>
      <td class="text-end">{{ r.StockBalance }}</td>
      <td>
        <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('product.detail_view', product_id=r.ProductId) }}">明細</a>
        <a class="btn btn-sm btn-outline-primary" href="{{ url_for('product.edit_view', product_id=r.ProductId) }}">編輯</a>
        <form action="{{ url_for('product.delete_view', product_id=r.ProductId) }}" method="post" class="d-inline"
              onsubmit="return confirm('確定要刪除物料 {{ r.ProductId }} 嗎？');">
          <button type="submit" class="btn btn-sm btn-outline-danger">刪除</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
