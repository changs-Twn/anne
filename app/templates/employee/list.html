{% extends "base.html" %}
{% block title %}員工管理{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>員工管理</h3>
  <a class="btn btn-primary" href="{{ url_for('employee.create_view') }}">+ 新增員工</a>
</div>
<table class="table table-striped table-bordered table-mini-erp bg-white">
  <thead>
    <tr>
      <th>員工編號</th>
      <th>姓名</th>
      <th>Email</th>
      <th style="width: 220px;">操作</th>
    </tr>
  </thead>
  <tbody>
    {% for r in rows %}
    <tr>
      <td>{{ r.EmployeeId }}</td>
      <td>{{ r.EmployeeName }}</td>
      <td>{{ r.Email or '' }}</td>
      <td>
        <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('employee.detail_view', employee_id=r.EmployeeId) }}">明細</a>
        <a class="btn btn-sm btn-outline-primary" href="{{ url_for('employee.edit_view', employee_id=r.EmployeeId) }}">編輯</a>
        <form action="{{ url_for('employee.delete_view', employee_id=r.EmployeeId) }}" method="post" class="d-inline"
              onsubmit="return confirm('確定要刪除員工 {{ r.EmployeeId }} 嗎？');">
          <button type="submit" class="btn btn-sm btn-outline-danger">刪除</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
