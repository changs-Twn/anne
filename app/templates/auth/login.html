<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入 - Mini ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="d-flex align-items-center" style="min-height: 100vh; background-color: #eef0f3;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-8 col-md-5 col-lg-4">
        <div class="card shadow">
          <div class="card-body p-4">
            <h4 class="text-center mb-4">Mini ERP 登入</h4>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ 'danger' if category == 'error' else category }}">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="post">
              <div class="mb-3">
                <label class="form-label">請輸入員工編號</label>
                <input type="text" name="employee_id" class="form-control" value="{{ employee_id }}" required autofocus maxlength="20">
              </div>
              <div class="mb-3">
                <label class="form-label">請輸入密碼</label>
                <input type="password" name="password" class="form-control" required maxlength="20">
              </div>
              <button type="submit" class="btn btn-primary w-100">登入</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
